name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync SvelteKit types
        run: bun run svelte-kit sync
        env:
          PUBLIC_SUPABASE_URL: 'http://localhost:54321'
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'ci-anon-key'
          PUBLIC_APP_URL: 'http://localhost:5173'
          PUBLIC_APP_NAME: 'ALC CI'
          SUPABASE_SERVICE_ROLE_KEY: 'ci-service-key'

      - name: Typecheck
        run: bun run check
        env:
          PUBLIC_SUPABASE_URL: 'http://localhost:54321'
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'ci-anon-key'
          PUBLIC_APP_URL: 'http://localhost:5173'
          PUBLIC_APP_NAME: 'ALC CI'
          SUPABASE_SERVICE_ROLE_KEY: 'ci-service-key'

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test
        env:
          PUBLIC_SUPABASE_URL: 'http://localhost:54321'
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'ci-anon-key'
          SUPABASE_SERVICE_ROLE_KEY: 'ci-service-key'

      - name: Build
        run: bun run build
        env:
          PUBLIC_SUPABASE_URL: 'http://localhost:54321'
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'ci-anon-key'
          PUBLIC_APP_URL: 'http://localhost:5173'
          PUBLIC_APP_NAME: 'ALC CI'
          SUPABASE_SERVICE_ROLE_KEY: 'ci-service-key'
